<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LIOR_PLAYERLIST</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');

  :root{
    --bg:#010101;
    --fg:#FFFFFF;
    --fg-dim:#C9C9C9;
    --fg-dimmer:#7A7A7A;
    --ok:#3DDC84;
    --bad:#FF5C5C;
    --border:#FFFFFF;
  }

  *{ box-sizing:border-box; image-rendering:pixelated; }

  html,body{
    margin:0;
    padding:0;
    background:var(--bg);
    color:var(--fg);
    font-family:'VT323', monospace;
    -webkit-font-smoothing:none;
  }

  body{
    min-height:100vh;
    padding:28px 16px 60px;
    font-size:23px;
    position:relative;
    overflow-x:hidden;
  }

  #rain{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
  }

  .wrap{
    max-width:1500px;
    margin:0 auto;
    position:relative;
    z-index:1;
  }

  .pixel{ font-family:'Press Start 2P', monospace; }

  /* ---------- top bar ---------- */
  .topbar{
    border:2px solid var(--border);
    background:rgba(1,1,1,0.93);
    backdrop-filter:blur(2px);
    padding:18px 20px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    flex-wrap:wrap;
    gap:14px;
  }

  .brand{
    font-family:'Press Start 2P', monospace;
    font-size:23px;
    line-height:1.4;
    position:relative;
    display:inline-block;
    animation:flicker 4.5s linear infinite;
  }

  .glitch{ position:relative; }
  .glitch::before, .glitch::after{
    content:attr(data-text);
    position:absolute;
    top:0; left:0;
    width:100%;
    overflow:hidden;
    background:var(--bg);
  }
  .glitch::before{
    color:#FFFFFF;
    animation:glitch-top 5s steps(2,end) infinite;
  }
  .glitch::after{
    color:#9A9A9A;
    animation:glitch-bottom 6.5s steps(2,end) infinite;
  }

  @keyframes flicker{
    0%, 92%, 100%{ opacity:1; }
    93%{ opacity:0.4; }
    94%{ opacity:1; }
    95%{ opacity:0.6; }
    96%{ opacity:1; }
  }

  @keyframes glitch-top{
    0%, 88%, 100%{ clip-path:inset(0 0 100% 0); transform:translate(0,0); }
    89%{ clip-path:inset(0 0 60% 0); transform:translate(-3px,-1px); }
    90%{ clip-path:inset(20% 0 40% 0); transform:translate(3px,1px); }
    91%{ clip-path:inset(0 0 100% 0); transform:translate(0,0); }
  }

  @keyframes glitch-bottom{
    0%, 84%, 100%{ clip-path:inset(100% 0 0 0); transform:translate(0,0); }
    85%{ clip-path:inset(60% 0 0 0); transform:translate(3px,1px); }
    86%{ clip-path:inset(30% 0 30% 0); transform:translate(-3px,-1px); }
    87%{ clip-path:inset(100% 0 0 0); transform:translate(0,0); }
  }

  @media (prefers-reduced-motion: reduce){
    .brand{ animation:none; }
    .glitch::before, .glitch::after{ animation:none; display:none; }
  }

  #brandText{ display:inline-block; }

  .cursor{
    display:inline-block;
    width:10px;
    height:14px;
    margin-left:2px;
    background:var(--fg);
    vertical-align:middle;
    animation:blink 1.1s steps(1) infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  .hostline{
    color:var(--fg-dim);
    font-size:20px;
    margin-top:8px;
  }

  .status{
    text-align:right;
    font-size:17px;
    color:var(--fg-dim);
  }

  .status .pill{
    display:inline-flex;
    align-items:center;
    gap:8px;
    border:2px solid var(--border);
    padding:6px 10px;
    font-family:'Press Start 2P', monospace;
    font-size:13px;
    color:var(--fg);
  }

  .status-actions{
    display:flex;
    align-items:center;
    gap:10px;
    justify-content:flex-end;
  }

  .status-actions button{
    padding:7px 10px;
    box-shadow:3px 3px 0 var(--fg);
  }
  .status-actions button:active{ transform:translate(3px,3px); box-shadow:0 0 0 var(--fg); }

  .dot{
    width:8px;
    height:8px;
    background:var(--fg-dimmer);
  }
  .dot.on{ background:var(--ok); }
  .dot.off{ background:var(--bad); }

  /* ---------- toolbar ---------- */
  .toolbar-panel{
    margin-top:16px;
    border:2px solid var(--border);
    background:rgba(1,1,1,0.93);
    backdrop-filter:blur(2px);
    padding:16px 20px;
    display:flex;
    flex-direction:column;
    gap:18px;
  }

  .field-block label{
    display:block;
    font-family:'Press Start 2P', monospace;
    font-size:13px;
    letter-spacing:0.5px;
    color:var(--fg-dim);
    margin-bottom:10px;
  }


  input[type="text"], input[type="number"]{
    flex:1 1 160px;
    min-width:0;
    background:var(--bg);
    border:2px solid var(--border);
    color:var(--fg);
    font-family:'VT323', monospace;
    font-size:23px;
    padding:8px 10px;
    outline:none;
  }
  input::placeholder{ color:var(--fg-dimmer); }

  button{
    font-family:'Press Start 2P', monospace;
    background:var(--bg);
    color:var(--fg);
    border:2px solid var(--border);
    padding:10px 14px;
    font-size:13px;
    cursor:pointer;
    box-shadow:4px 4px 0 var(--fg);
    transition:transform .05s linear, box-shadow .05s linear, background .1s, color .1s;
    flex:0 0 auto;
  }
  button:hover{ background:var(--fg); color:var(--bg); }
  button:active{ transform:translate(4px,4px); box-shadow:0 0 0 var(--fg); }
  button:disabled{
    color:var(--fg-dimmer);
    border-color:var(--fg-dimmer);
    box-shadow:4px 4px 0 var(--fg-dimmer);
    cursor:not-allowed;
  }
  button:disabled:hover{ background:var(--bg); color:var(--fg-dimmer); }
  button:disabled:active{ transform:none; box-shadow:4px 4px 0 var(--fg-dimmer); }

  /* ---------- list ---------- */
  .listbox{
    margin-top:16px;
    border:2px solid var(--border);
    background:rgba(1,1,1,0.93);
    backdrop-filter:blur(2px);
  }

  .listhead, .row{
    display:grid;
    grid-template-columns:90px 1fr 90px;
    gap:10px;
    padding:10px 18px;
    align-items:center;
  }

  .listhead{
    font-family:'Press Start 2P', monospace;
    font-size:12px;
    letter-spacing:0.5px;
    color:var(--fg-dim);
    border-bottom:2px solid var(--border);
  }

  .sortable{
    cursor:pointer;
    user-select:none;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .listhead div[style*="text-align:right"].sortable{ justify-content:flex-end; }
  .sortable:hover{ color:var(--fg); }
  .sort-arrow{ font-size:10px; min-width:8px; display:inline-block; }

  .row{
    border-bottom:1px solid var(--fg-dimmer);
    cursor:pointer;
    font-size:23px;
  }
  .row:last-child{ border-bottom:none; }
  .row:hover{ background:var(--fg); color:var(--bg); }
  .row:hover .ping{ color:var(--bg); }
  .row:hover .id-badge{ color:var(--bg); }

  .id-badge{ color:var(--fg-dim); font-size:20px; }

  .pname{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ping{ text-align:right; font-size:19px; }
  .ping.good{ color:var(--ok); }
  .ping.mid{ color:#E8C547; }
  .ping.bad{ color:var(--bad); }
  .row:hover .ping.good, .row:hover .ping.mid, .row:hover .ping.bad{ color:var(--bg); }

  .row.is-left{
    opacity:0.45;
    font-style:italic;
  }
  .row.is-left:hover{ opacity:0.7; }
  .ping.left-tag{ color:var(--fg-dimmer); font-style:italic; font-size:15px; }
  .row.is-left:hover .ping.left-tag{ color:var(--bg); }

  .row.is-new{
    animation:newJoin 2.2s ease-out;
  }
  @keyframes newJoin{
    0%{ background:var(--fg); color:var(--bg); }
    100%{ background:transparent; color:var(--fg); }
  }
  .row.is-new .ping.good, .row.is-new .ping.mid, .row.is-new .ping.bad{
    animation:newJoinPing 2.2s ease-out;
  }
  @keyframes newJoinPing{
    0%{ color:var(--bg); }
    100%{ }
  }

  .empty, .err{
    padding:34px 16px;
    text-align:center;
    color:var(--fg-dim);
    font-size:20px;
    line-height:1.7;
  }
  .err{ color:var(--bad); }

  .footer-note{
    margin-top:14px;
    font-size:16px;
    color:var(--fg-dimmer);
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
  }

  /* ---------- modal ---------- */
  .overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.85);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:50;
  }
  .overlay.show{ display:flex; }

  .modal{
    width:100%;
    max-width:380px;
    background:rgba(1,1,1,0.96);
    backdrop-filter:blur(3px);
    border:2px solid var(--border);
    box-shadow:6px 6px 0 var(--fg);
    padding:22px;
  }

  .modal-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    border-bottom:2px solid var(--fg-dimmer);
    padding-bottom:14px;
    margin-bottom:16px;
  }

  .modal-id{
    font-family:'Press Start 2P', monospace;
    font-size:12px;
    letter-spacing:0.5px;
    color:var(--fg-dim);
  }

  .modal-name{
    font-size:30px;
    margin-top:8px;
    word-break:break-word;
  }

  .modal-close{
    border:2px solid var(--border);
    padding:4px 9px;
    font-size:14px;
    box-shadow:3px 3px 0 var(--fg);
  }

  .field{ margin-bottom:14px; }
  .field-label{
    font-family:'Press Start 2P', monospace;
    font-size:12px;
    letter-spacing:0.5px;
    color:var(--fg-dim);
    margin-bottom:8px;
  }
  .field-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    border:2px solid var(--fg-dimmer);
    padding:9px 10px;
  }
  .field-value{
    font-size:20px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .field-value.muted{ color:var(--fg-dimmer); }

  .open-btn{ font-size:12px; padding:7px 10px; box-shadow:3px 3px 0 var(--fg); flex-shrink:0; }
  .open-btn:active{ transform:translate(3px,3px); box-shadow:0 0 0 var(--fg); }

  .field-actions{ display:flex; gap:8px; flex-shrink:0; }
  .copy-btn{ font-size:12px; padding:7px 9px; box-shadow:3px 3px 0 var(--fg); flex-shrink:0; }
  .copy-btn:active{ transform:translate(3px,3px); box-shadow:0 0 0 var(--fg); }
  .copy-btn.copied{ background:var(--ok); color:var(--bg); border-color:var(--ok); }

  /* ---------- contact ---------- */
  .contact-btn{ border-color:#5865F2; box-shadow:3px 3px 0 #5865F2 !important; }
  .contact-btn:hover{ background:#5865F2; color:var(--fg); }

  .contact-link{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    border:2px solid var(--border);
    padding:12px;
    margin-bottom:12px;
    color:var(--fg);
    text-decoration:none;
    box-shadow:4px 4px 0 var(--fg);
    transition:transform .05s linear, box-shadow .05s linear, background .1s, color .1s;
  }
  .contact-link:hover{ background:#5865F2; border-color:#5865F2; box-shadow:4px 4px 0 var(--fg); }
  .contact-link:active{ transform:translate(4px,4px); box-shadow:0 0 0 var(--fg); }
  .contact-link .cl-title{ font-family:'Press Start 2P', monospace; font-size:12px; }
  .contact-link .cl-sub{ font-size:18px; color:var(--fg-dim); margin-top:6px; }
  .contact-link:hover .cl-sub{ color:var(--fg); }
  .contact-link .cl-arrow{ font-family:'Press Start 2P', monospace; font-size:14px; }

  .hint{
    font-size:16px;
    color:var(--fg-dimmer);
    margin-top:10px;
    line-height:1.6;
  }

  @media (prefers-reduced-motion: reduce){
    .cursor{ animation:none; }
  }

  /* ---------- mobile layout pass ---------- */
  @media (max-width: 640px){
    body{ padding:14px 8px 40px; font-size:19px; }

    .brand{ font-size:17px; }
    .hostline{ font-size:15px; }

    .topbar{ flex-direction:column; align-items:stretch; padding:14px; }
    .status{ text-align:left; }
    .status-actions{ justify-content:flex-start; }
    .status .pill{ font-size:11px; }

    .toolbar-panel{ padding:12px 14px; }
    .field-block label{ font-size:11px; }
    input[type="text"], input[type="number"]{ font-size:18px; }

    .listhead, .row{
      grid-template-columns:54px 1fr 64px;
      gap:6px;
      padding:9px 10px;
    }
    .listhead{ font-size:9px; }
    .row{ font-size:17px; }
    .id-badge{ font-size:15px; }
    .ping{ font-size:15px; }
    .sort-arrow{ font-size:8px; }

    .modal{ max-width:100%; padding:16px; }
    .modal-name{ font-size:22px; }
    .field-value{ font-size:16px; }
    .field-actions{ flex-wrap:wrap; }

    .footer-note{ font-size:13px; }
  }
</style>
</head>
<body>
<canvas id="rain"></canvas>
<div class="wrap">

  <div class="topbar">
    <div>
      <div class="brand" data-text="LIOR_PLAYERLIST"><span id="brandText">LIOR_PLAYERLIST</span><span class="cursor">&nbsp;</span></div>
      <div class="hostline" id="hostline">live player feed</div>
    </div>
    <div class="status">
      <div class="status-actions">
        <div class="pill"><span class="dot" id="statusDot"></span><span id="statusText">CHECKING</span></div>
        <button id="refreshBtn">REFRESH</button>
        <button id="contactBtn" class="contact-btn">CONTACT</button>
      </div>
      <div style="margin-top:8px;" id="countText">— online</div>
    </div>
  </div>

  <div class="toolbar-panel">
    <div class="field-block">
      <label>FILTER LIST — name or id</label>
      <input type="text" id="filterInput" placeholder="type to filter…" />
    </div>
  </div>

  <div class="listbox">
    <div class="listhead">
      <div class="sortable" data-sort="id">ID<span class="sort-arrow" id="sortArrow-id"></span></div>
      <div class="sortable" data-sort="name">STEAM NAME<span class="sort-arrow" id="sortArrow-name"></span></div>
      <div class="sortable" style="text-align:right;" data-sort="ping">PING<span class="sort-arrow" id="sortArrow-ping"></span></div>
    </div>
    <div id="listBody">
      <div class="empty">loading player list…</div>
    </div>
  </div>

  <div class="footer-note">
    <span id="lastUpdated">—</span>
  </div>

</div>

<!-- ---------- popup ---------- -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-top">
      <div>
        <div class="modal-id" id="modalId">ID —</div>
        <div class="modal-name" id="modalName">—</div>
      </div>
      <button class="modal-close" id="modalClose">X</button>
    </div>

    <div class="field">
      <div class="field-label">DISCORD</div>
      <div class="field-row">
        <span class="field-value" id="modalDiscordVal">—</span>
        <div class="field-actions">
          <button class="copy-btn" id="modalDiscordCopyBtn" disabled>COPY</button>
          <button class="open-btn" id="modalDiscordBtn" disabled>OPEN</button>
        </div>
      </div>
    </div>

    <div class="hint" id="modalHint"></div>
  </div>
</div>

<!-- ---------- contact popup ---------- -->
<div class="overlay" id="contactOverlay">
  <div class="modal">
    <div class="modal-top">
      <div>
        <div class="modal-id">GET IN TOUCH</div>
        <div class="modal-name">CONTACT ON DISCORD</div>
      </div>
      <button class="modal-close" id="contactClose">X</button>
    </div>

    <a class="contact-link" href="https://discord.com/users/750352164911841361" target="_blank" rel="noopener">
      <div>
        <div class="cl-title">MESSAGE ME</div>
        <div class="cl-sub">open my discord profile</div>
      </div>
      <span class="cl-arrow">&gt;</span>
    </a>

    <a class="contact-link" href="https://discord.gg/eEmdUjJzMY" target="_blank" rel="noopener">
      <div>
        <div class="cl-title">JOIN THE SERVER</div>
        <div class="cl-sub">discord.gg/eEmdUjJzMY</div>
      </div>
      <span class="cl-arrow">&gt;</span>
    </a>
  </div>
</div>

<script>
/* =========================================================
   LIOR_PLAYERLIST — config
   ========================================================= */
const CONFIG = {
  // Same-origin path served by server.js, which fetches the real
  // players.json server-side (no CORS issue, since browser-to-server
  // same-origin requests aren't subject to CORS at all).
  BACKEND_URL: '/api/players',

  // shown in the top bar instead of a fetched hostname, since players.json
  // doesn't include server metadata
  SERVER_LABEL: 'LIOR SERVER',

  // how often to auto-refresh, in ms
  REFRESH_MS: 5000,
};

/* ========================================================= */

let players = [];      // current player rows: {id, name, ping, discordId}
let backendOk = null;  // null = not tried yet, true/false after first attempt
let knownIds = new Set();   // ids seen on the previous successful load, for new-join highlight
let sortKey = null;          // 'id' | 'name' | 'ping' | null (server order)
let sortDir = 1;              // 1 = ascending, -1 = descending

// players.json -> {discordId} parsing happens server-side in server.js

async function fetchBackendData(){
  const res = await fetch(CONFIG.BACKEND_URL, { cache: 'no-store' });
  if(!res.ok){
    // server.js sends { error } on failure — show the real reason
    let detail = '';
    try{ detail = (await res.json()).error || ''; }catch(e){}
    throw new Error(detail || ('backend http ' + res.status));
  }
  const data = await res.json();
  // server.js already normalizes the shape to { players: [{id,name,ping,discordId}] }
  return data.players || [];
}

// skip a refresh tick if the previous request is still in flight, so a
// slow game server doesn't pile up overlapping requests
let loading = false;
async function loadAll(){
  if(loading) return;
  loading = true;
  try{ await loadAllInner(); }finally{ loading = false; }
}

async function loadAllInner(){
  const hostline = document.getElementById('hostline');
  const dot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const countText = document.getElementById('countText');
  const listBody = document.getElementById('listBody');

  let backendList = null;
  let lastError = null;
  try{
    backendList = await fetchBackendData();
    backendOk = true;
  }catch(e){
    backendOk = false;
    lastError = e;
    console.error('LIOR_PLAYERLIST: backend (players.json) unreachable:', e);
  }

  if(!backendList){
    dot.className = 'dot off';
    statusText.textContent = 'OFFLINE';
    countText.textContent = '— online';
    hostline.textContent = 'could not reach players.json';

    // A bare "TypeError: Failed to fetch" with nothing else in the console
    // is the classic CORS / mixed-content signature in browsers — the
    // request never gets a readable response, so we can't tell
    // network-down apart from blocked-by-browser from here. Surface the
    // raw message so it's visible without opening devtools.
    const rawMsg = lastError ? (lastError.message || String(lastError)) : 'unknown error';
    listBody.innerHTML = `<div class="err">
      couldn't read /api/players.<br/>
      browser error: <span style="color:var(--fg);">${escapeHtml(rawMsg)}</span><br/><br/>
      this dashboard is now served by server.js, which fetches players.json
      itself — so if this fails, either server.js isn't running, or it
      couldn't reach <span style="color:var(--fg);">${escapeHtml('http://45.129.243.5:30120/players.json')}</span> from the
      machine it's running on. check the server.js console output for the
      real error.
    </div>`;
    return;
  }

  dot.className = 'dot on';
  statusText.textContent = 'ONLINE';
  hostline.textContent = CONFIG.SERVER_LABEL;

  players = backendList;
  const onlineCount = players.filter(p => p.status !== 'left').length;
  countText.textContent = `${onlineCount} online`;

  // figure out who's new since the last successful load, for the
  // join-highlight effect — skip on the very first load so the whole
  // list doesn't flash on initial page load
  const currentIds = new Set(players.map(p => String(p.id)));
  const isFirstLoad = knownIds.size === 0 && !window.__liorHadFirstLoad;
  const newIds = isFirstLoad ? new Set() : [...currentIds].filter(id => !knownIds.has(id));
  window.__liorHadFirstLoad = true;
  knownIds = currentIds;

  renderList(players, new Set(newIds));
  document.getElementById('lastUpdated').textContent =
    'updated ' + new Date().toLocaleTimeString();
}

function pingClass(ping){
  if(ping == null) return '';
  if(ping <= 60) return 'good';
  if(ping <= 120) return 'mid';
  return 'bad';
}

function leftAgoText(leftAt){
  if(!leftAt) return 'left';
  const mins = Math.floor((Date.now() - leftAt) / 60000);
  if(mins <= 0) return 'left <1m ago';
  return `left ${mins}m ago`;
}

function sortPlayers(list){
  let sorted = [...list];

  if(!sortKey){
    // default order: everyone online first (in their original order),
    // recently-left players after, most-recently-left first
    sorted.sort((a, b) => {
      const aLeft = a.status === 'left', bLeft = b.status === 'left';
      if(aLeft !== bLeft) return aLeft ? 1 : -1;
      if(aLeft && bLeft) return (b.leftAt ?? 0) - (a.leftAt ?? 0);
      return 0;
    });
    return sorted;
  }

  sorted.sort((a, b) => {
    let av, bv;
    if(sortKey === 'id'){ av = Number(a.id); bv = Number(b.id); }
    else if(sortKey === 'ping'){ av = a.ping ?? Infinity; bv = b.ping ?? Infinity; }
    else { av = a.name.toLowerCase(); bv = b.name.toLowerCase(); }
    if(av < bv) return -1 * sortDir;
    if(av > bv) return 1 * sortDir;
    return 0;
  });
  return sorted;
}

function updateSortArrows(){
  ['id','name','ping'].forEach(key => {
    const el = document.getElementById('sortArrow-' + key);
    if(!el) return;
    el.textContent = (sortKey === key) ? (sortDir === 1 ? '▲' : '▼') : '';
  });
}

function renderList(list, newIds){
  newIds = newIds || new Set();
  const listBody = document.getElementById('listBody');
  const filterVal = document.getElementById('filterInput').value.trim().toLowerCase();

  let shown = list;
  if(filterVal){
    shown = shown.filter(p =>
      String(p.id).includes(filterVal) || p.name.toLowerCase().includes(filterVal)
    );
  }
  shown = sortPlayers(shown);
  updateSortArrows();

  if(shown.length === 0){
    listBody.innerHTML = `<div class="empty">no players match — server may be empty right now.</div>`;
    return;
  }

  listBody.innerHTML = shown.map(p => {
    const isLeft = p.status === 'left';
    const isNew = !isLeft && newIds.has(String(p.id));
    const pingHtml = isLeft
      ? `<div class="ping left-tag">${leftAgoText(p.leftAt)}</div>`
      : `<div class="ping ${pingClass(p.ping)}">${p.ping != null ? p.ping + 'ms' : '—'}</div>`;
    return `
    <div class="row${isNew ? ' is-new' : ''}${isLeft ? ' is-left' : ''}" data-id="${p.id}">
      <div class="id-badge">[${String(p.id).padStart(3,'0')}]</div>
      <div class="pname">${escapeHtml(p.name)}</div>
      ${pingHtml}
    </div>
  `;
  }).join('');

  listBody.querySelectorAll('.row').forEach(row => {
    row.addEventListener('click', () => openModal(row.dataset.id));
  });
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function openModal(id){
  const p = players.find(pl => String(pl.id) === String(id));
  const overlay = document.getElementById('overlay');

  if(!p){
    document.getElementById('modalId').textContent = `ID ${id}`;
    document.getElementById('modalName').textContent = 'no player connected with that ID';
    document.getElementById('modalDiscordVal').textContent = '—';
    document.getElementById('modalDiscordBtn').disabled = true;
    document.getElementById('modalDiscordCopyBtn').disabled = true;
    document.getElementById('modalHint').textContent = '';
    overlay.classList.add('show');
    return;
  }

  document.getElementById('modalId').textContent = `IN-GAME ID [${String(p.id).padStart(3,'0')}]`;
  document.getElementById('modalName').textContent = p.name;

  const discordBtn = document.getElementById('modalDiscordBtn');
  const discordCopyBtn = document.getElementById('modalDiscordCopyBtn');
  const discordVal = document.getElementById('modalDiscordVal');
  if(p.discordId){
    discordVal.textContent = p.discordId;
    discordVal.classList.remove('muted');
    discordBtn.disabled = false;
    discordBtn.onclick = () => window.open(`https://discord.com/users/${p.discordId}`, '_blank', 'noopener');

    discordCopyBtn.disabled = false;
    discordCopyBtn.textContent = 'COPY';
    discordCopyBtn.classList.remove('copied');
    discordCopyBtn.onclick = async () => {
      try{
        await navigator.clipboard.writeText(p.discordId);
      }catch(e){
        // clipboard API can fail (no permission, insecure context) — fall
        // back to a manual selection so the user can still copy it
        const range = document.createRange();
        range.selectNodeContents(discordVal);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      }
      discordCopyBtn.textContent = 'COPIED';
      discordCopyBtn.classList.add('copied');
      setTimeout(() => {
        discordCopyBtn.textContent = 'COPY';
        discordCopyBtn.classList.remove('copied');
      }, 1400);
    };
  }else{
    discordVal.textContent = 'not linked';
    discordVal.classList.add('muted');
    discordBtn.disabled = true;
    discordCopyBtn.disabled = true;
    discordCopyBtn.textContent = 'COPY';
    discordCopyBtn.classList.remove('copied');
    discordCopyBtn.onclick = null;
  }

  let hintText = '';
  if(backendOk === false){
    hintText = 'players.json unreachable right now';
  }else if(p.status === 'left'){
    hintText = `this player disconnected (${leftAgoText(p.leftAt)}) — they'll drop off the list automatically after staying gone for a while.`;
  }
  document.getElementById('modalHint').textContent = hintText;

  overlay.classList.add('show');
}

document.getElementById('modalClose').addEventListener('click', () => {
  document.getElementById('overlay').classList.remove('show');
});

// Close only if the press started on the backdrop itself — using
// mousedown instead of click means dragging to select text (e.g. a
// Discord ID) and releasing the mouse past the modal's edge no longer
// counts as "clicking outside" and closes it mid-selection.
document.getElementById('overlay').addEventListener('mousedown', (e) => {
  if(e.target.id === 'overlay') document.getElementById('overlay').classList.remove('show');
});

const contactOverlay = document.getElementById('contactOverlay');
document.getElementById('contactBtn').addEventListener('click', () => contactOverlay.classList.add('show'));
document.getElementById('contactClose').addEventListener('click', () => contactOverlay.classList.remove('show'));
contactOverlay.addEventListener('mousedown', (e) => {
  if(e.target === contactOverlay) contactOverlay.classList.remove('show');
});

document.getElementById('filterInput').addEventListener('input', () => renderList(players));
document.getElementById('refreshBtn').addEventListener('click', loadAll);

document.querySelectorAll('.sortable').forEach(headerEl => {
  headerEl.addEventListener('click', () => {
    const key = headerEl.dataset.sort;
    if(sortKey === key){
      sortDir *= -1;
    }else{
      sortKey = key;
      sortDir = 1;
    }
    renderList(players);
  });
});

// typewriter loop: types the title out, holds, deletes it, holds, repeats
// forever — a clear, continuous animated effect (cursor span already
// blinks via CSS, so it reads naturally during both phases)
(function(){
  const el = document.getElementById('brandText');
  const FULL_TEXT = el.textContent;
  const TYPE_SPEED = 90;     // ms per character while typing
  const DELETE_SPEED = 50;   // ms per character while deleting
  const HOLD_FULL = 1800;    // pause once fully typed
  const HOLD_EMPTY = 500;    // pause once fully deleted

  let i = 0;
  let deleting = false;

  function tick(){
    if(!deleting){
      i++;
      el.textContent = FULL_TEXT.slice(0, i);
      if(i >= FULL_TEXT.length){
        deleting = true;
        setTimeout(tick, HOLD_FULL);
        return;
      }
      setTimeout(tick, TYPE_SPEED);
    }else{
      i--;
      el.textContent = FULL_TEXT.slice(0, i);
      if(i <= 0){
        deleting = false;
        setTimeout(tick, HOLD_EMPTY);
        return;
      }
      setTimeout(tick, DELETE_SPEED);
    }
  }

  el.textContent = '';
  setTimeout(tick, HOLD_EMPTY);
})();

loadAll();
setInterval(loadAll, CONFIG.REFRESH_MS);

/* =========================================================
   background — monochrome matrix-style falling characters
   ========================================================= */
(function(){
  const canvas = document.getElementById('rain');
  const ctx = canvas.getContext('2d');
  const fontSize = 16;
  // katakana + digits gives the classic monochrome "matrix" look
  const chars = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789';
  let w, h, columns, drops, speeds;

  function resize(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    columns = Math.floor(w / fontSize);
    drops = new Array(columns).fill(0).map(() => Math.random() * (h / fontSize));
    speeds = new Array(columns).fill(0).map(() => 0.6 + Math.random() * 1.1);
  }
  window.addEventListener('resize', resize);
  resize();

  function draw(){
    // slightly translucent black wash leaves a fading trail behind each glyph
    ctx.fillStyle = 'rgba(1,1,1,0.14)';
    ctx.fillRect(0, 0, w, h);
    ctx.font = fontSize + 'px monospace';
    ctx.textAlign = 'center';

    for(let i = 0; i < columns; i++){
      const text = chars[Math.floor(Math.random() * chars.length)];
      const x = i * fontSize + fontSize / 2;
      const y = drops[i] * fontSize;

      if(y > 0){
        // bright white leading glyph
        ctx.shadowColor = 'rgba(255,255,255,0.9)';
        ctx.shadowBlur = 6;
        ctx.fillStyle = 'rgba(255,255,255,0.95)';
        ctx.fillText(text, x, y);
        ctx.shadowBlur = 0;

        // dimmer grey echo just above it, for a denser trail
        const text2 = chars[Math.floor(Math.random() * chars.length)];
        ctx.fillStyle = 'rgba(200,200,200,0.35)';
        ctx.fillText(text2, x, y - fontSize);
      }

      if(y > h && Math.random() > 0.975) drops[i] = 0;
      drops[i] += speeds[i];
    }
  }
  setInterval(draw, 45);
})();
</script>
